name: Release

run-name: Release (impeller.lock.json of ${{ github.ref_name }})

# Packs the impeller-builder release pinned in impeller.lock.json. The package version comes from the lock
# (Flutter version and binding revision); pin another release with ./build.sh BumpImpeller --tag <tag>.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x ./build.sh
          ./build.sh Pack

      - name: Summary
        run: |
          {
            echo "### Packages"
            echo
            jq -r '"impeller-builder `\(.tag)`, Flutter \(.version) (\(.kind)), revision \(.revision)"' impeller.lock.json
            echo
            for f in artifacts/packages/*.nupkg; do
              echo "- \`$(basename "$f")\` ($(du -h "$f" | cut -f1))"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 7

  # Separate job so the push runs under the 'release' environment and its secrets.
  push:
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./nupkgs

      - name: Push to Release Manager
        run: dotnet nuget push './nupkgs/*.nupkg' --api-key '${{ secrets.RELEASE_MANAGER_API_KEY }}' --source '${{ vars.RELEASE_MANAGER_UPLOAD_URL }}'
